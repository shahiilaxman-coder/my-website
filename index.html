<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Love Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        .hearts-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .heart-particle {
            position: absolute;
            color: rgba(255,255,255,0.6);
            animation: float linear infinite;
            pointer-events: none;
        }
        @keyframes float {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(255,105,180,0.3);
            z-index: 1;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #ff9ff3, #54a0ff);
        }
        .title-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        h1 {
            font-size: 1.8rem;
            color: #e84393;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #888;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }
        .input-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            margin: 2rem 0 1.5rem;
            flex-wrap: wrap;
        }
        .input-group {
            flex: 1;
            min-width: 140px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #e84393;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 2px solid #ffcdd2;
            border-radius: 1rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background: #fff5f5;
        }
        .input-group input:focus {
            border-color: #e84393;
            box-shadow: 0 0 0 4px rgba(232,67,147,0.15);
        }
        .heart-divider {
            font-size: 2rem;
            color: #ff6b6b;
            animation: pulse 1.5s infinite;
        }
        .btn-calculate {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 1rem;
            background: linear-gradient(135deg, #e84393 0%, #fd79a8 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(232,67,147,0.3);
        }
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(232,67,147,0.4);
        }
        .result-section { display: none; margin-top: 2rem; }
        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 1.5rem;
        }
        .percentage-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .percentage-text .num {
            font-size: 3rem;
            font-weight: 800;
            color: #e84393;
        }
        .percentage-text .label {
            font-size: 0.8rem;
            color: #888;
        }
        .names-display {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .message {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }
        .btn-reset {
            margin-top: 1.5rem;
            padding: 0.8rem 2rem;
            border: 2px solid #e84393;
            border-radius: 1rem;
            background: transparent;
            color: #e84393;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-reset:hover {
            background: #e84393;
            color: white;
        }
        .footer-note {
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            z-index: 1;
        }
        @media (max-width: 480px) {
            .card { padding: 2rem 1.5rem; }
            h1 { font-size: 1.5rem; }
            .circle-container { width: 160px; height: 160px; }
            .percentage-text .num { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="hearts-container" id="heartsContainer"></div>

    <div class="card">
        <div class="top-bar"></div>
        
        <div class="title-icon">💕</div>
        <h1>Love Calculator</h1>
        <p class="subtitle">नाम हाल्नुहोस् र तपाईंको सम्बन्ध जान्नुहोस्</p>

        <div id="inputSection">
            <div class="input-row">
                <div class="input-group">
                    <label>👦 केटाको नाम</label>
                    <input type="text" id="name1" placeholder="Ram">
                </div>
                <div class="heart-divider">❤️</div>
                <div class="input-group">
                    <label>👧 केटीको नाम</label>
                    <input type="text" id="name2" placeholder="Sita">
                </div>
            </div>
            <button class="btn-calculate" onclick="calculateLove()">🔮 Calculate Love %</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="circle-container">
                <svg viewBox="0 0 200 200" style="width:100%;height:100%;transform:rotate(-90deg);">
                    <circle cx="100" cy="100" r="85" fill="none" stroke="#ffe0e0" stroke-width="12"/>
                    <circle id="progressCircle" cx="100" cy="100" r="85" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="534" stroke-dashoffset="534" style="transition:stroke-dashoffset 2.5s cubic-bezier(0.4,0,0.2,1);"/>
                    <defs>
                        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#ff6b6b"/>
                            <stop offset="100%" style="stop-color:#e84393"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="percentage-text">
                    <div class="num" id="percentageNum">0%</div>
                    <div class="label">Match</div>
                </div>
            </div>

            <div class="names-display" id="namesDisplay"></div>
            <div class="status-badge" id="statusBadge"></div>
            <p class="message" id="message"></p>

            <button class="btn-reset" onclick="resetCalc()">🔄 फेरि हेर्नुहोस्</button>
        </div>
    </div>

    <p class="footer-note">💝 Just for fun! Entertainment purpose only.</p>

    <script>
        // Floating hearts background
        const heartsContainer = document.getElementById('heartsContainer');
        const heartEmojis = ['💕','💖','💗','💓','💝','❤️','💘'];
        for(let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 6 + 4) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heartsContainer.appendChild(heart);
        }

        function calculateLove() {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();

            if(!name1 || !name2) {
                alert('कृपया दुवै नाम हाल्नुहोस्!');
                return;
            }

            // Calculate percentage (deterministic for same names)
            let combined = (name1.toLowerCase() + name2.toLowerCase()).replace(/\s/g, '');
            let hash = 0;
            for(let i = 0; i < combined.length; i++) {
                hash = ((hash << 5) - hash) + combined.charCodeAt(i);
                hash = hash & hash;
            }
            let percentage = Math.abs(hash % 101);

            // Easter eggs: legendary Nepali pairs always get 100%
            const pair = name1.toLowerCase() + '+' + name2.toLowerCase();
            const reversePair = name2.toLowerCase() + '+' + name1.toLowerCase();
            const legendaryPairs = ['ram+sita','sita+ram','shiva+parvati','parvati+shiva','krishna+radha','radha+krishna'];
            if(legendaryPairs.includes(pair) || legendaryPairs.includes(reversePair)) {
                percentage = 100;
            }

            // Show result
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('namesDisplay').textContent = '👦 ' + name1 + '  ❤️  👧 ' + name2;

            // Animate circle
            const circle = document.getElementById('progressCircle');
            const circumference = 534;
            const offset = circumference - (percentage / 100) * circumference;
            setTimeout(() => { circle.style.strokeDashoffset = offset; }, 100);

            // Count up animation
            let current = 0;
            const step = Math.max(1, Math.floor(percentage / 50));
            const counter = setInterval(() => {
                current += step;
                if(current >= percentage) {
                    clearInterval(counter);
                    document.getElementById('percentageNum').textContent = percentage + '%';
                } else {
                    document.getElementById('percentageNum').textContent = current + '%';
                }
            }, 30);

            // Status & message
            const badge = document.getElementById('statusBadge');
            const msg = document.getElementById('message');

            if(percentage >= 90) {
                badge.textContent = '🔥 Soulmates!';
                badge.style.background = '#ffe0e0';
                badge.style.color = '#e84393';
                msg.textContent = 'तपाईंहरूको जोडी जस्तो संसारमा अरु कोही छैन! यो प्रेम सदाबहार छ। 💍✨';
            } else if(percentage >= 70) {
                badge.textContent = '💘 Perfect Match!';
                badge.style.background = '#fff3e0';
                badge.style.color = '#f39c12';
                msg.textContent = 'तपाईंहरूको बीचमा गहिरो बुझाइ र सम्मान छ। यो सम्बन्ध अझै बलियो बनाउनुहोस्! 🌹';
            } else if(percentage >= 50) {
                badge.textContent = '💕 Good Chemistry';
                badge.style.background = '#e3f2fd';
                badge.style.color = '#2196f3';
                msg.textContent = 'राम्रो सुरुवात! एकअर्कालाई बुझ्न समय दिनुहोस्, सम्बन्ध अझै राम्रो हुनेछ। ☕';
            } else if(percentage >= 30) {
                badge.textContent = '🌱 Growing Bond';
                badge.style.background = '#e8f5e9';
                badge.style.color = '#4caf50';
                msg.textContent = 'सम्बन्ध बनाउन मेहनत चाहिन्छ। एकअर्काको रुचि र विचार बुझ्न प्रयास गर्नुहोस्। 🤝';
            } else {
                badge.textContent = '💫 Just Friends?';
                badge.style.background = '#f3e5f5';
                badge.style.color = '#9c27b0';
                msg.textContent = 'प्रेम भन्दा पनि राम्रो मित्रता हुन सक्छ! सबै सम्बन्ध राम्रो हुन्छ। 😊';
            }
        }

        function resetCalc() {
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('progressCircle').style.strokeDashoffset = 534;
            document.getElementById('name1').value = '';
            document.getElementById('name2').value = '';
        }
    </script>
</body>
</html>
